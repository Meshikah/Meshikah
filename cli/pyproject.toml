[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mshkh"
version = "0.1.0.dev0"
description = "MeshikahAI CLI: request-driven context engineering for AI-assisted work (skeleton)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "All rights reserved" }
authors = [{ name = "Armando" }]
dependencies = ["pyyaml>=6", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mshkh = "mshkh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
